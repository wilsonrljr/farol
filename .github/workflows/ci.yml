name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv and locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --locked --extra dev

      - name: Run tests with coverage
        run: uv run --locked --no-sync pytest --cov=backend.app --cov-report=xml --cov-report=term-missing -q

      - name: Lint and format check
        run: |
          uv run --locked --no-sync ruff check backend
          uv run --locked --no-sync ruff format --check backend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # Use o lockfile para chavear cache. Se mover, ajuste.
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose manifests
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

      - name: Smoke test hardened same-origin runtime
        run: |
          docker compose -f docker-compose.prod.yml up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz > /dev/null
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"monthly_expenses":5000,"current_portfolio":100000,"horizon_months":1}' \
            http://127.0.0.1:8080/api/fire > /dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:8080/ \
            | grep --ignore-case --quiet "content-security-policy: default-src 'self'"
          curl --silent --output /dev/null --write-out '%{http_code}\n' \
            --header 'Content-Type: application/json' \
            --header 'Content-Length: 4194305' \
            --header 'Expect: 100-continue' \
            --data-binary '{}' \
            http://127.0.0.1:8080/api/fire \
            | grep --quiet '^413$'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Stop smoke-test runtime
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
