# nginx.conf is copied into conf.d, which is included inside nginx's http block.
# Keep all runtime writes inside /tmp so the container root filesystem can be
# read-only and the nginx master can run without root or Linux capabilities.
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 4m;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  include /etc/nginx/security-headers.conf;

  error_page 413 = @request_body_too_large;
  location @request_body_too_large {
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    include /etc/nginx/security-headers.conf;
    return 413 '{"detail":"Request body is too large (maximum 4194304 bytes)"}';
  }

  # Preserve the complete `/api/...` URI. The absence of a trailing slash on
  # proxy_pass is intentional; adding one would strip the `/api/` prefix.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /healthz {
    proxy_pass http://backend:8000/healthz;
    proxy_set_header Host $host;
  }

  location = /readyz {
    proxy_pass http://backend:8000/readyz;
    proxy_set_header Host $host;
  }

  # Vite filenames under /assets contain a content hash and are safe to cache
  # indefinitely. Missing assets must not fall back to the SPA shell.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    include /etc/nginx/security-headers.conf;
  }

  # React / Vite SPA handling. HTML is always revalidated so a deployment does
  # not leave clients pointing at obsolete hashed assets.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    include /etc/nginx/security-headers.conf;
  }
}
